<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min Bredbandskoll</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Hastighetstest</h1>
        <button id="start-btn">Starta mätning</button>
        
        <div class="results">
            <div class="result-box">
                <h3>Ping</h3>
                <p><span id="ping-result">--</span> ms</p>
            </div>
            <div class="result-box">
                <h3>Nedladdning</h3>
                <p><span id="download-result">--</span> Mbit/s</p>
            </div>
            <div class="result-box">
                <h3>Uppladdning</h3>
                <p><span id="upload-result">--</span> Mbit/s</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
